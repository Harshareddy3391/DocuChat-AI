name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        env:
          PYTHONPATH: .
          APP_NAME: "DocuChat AI"
          APP_VERSION: "1.0.0"
          DEBUG: "false"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test_db"
          GOOGLE_CLIENT_ID: "ci-dummy-google-client-id"
          GOOGLE_CLIENT_SECRET: "ci-dummy-google-client-secret"
          GOOGLE_REDIRECT_URI: "http://localhost:8000/auth/callback"
          JWT_SECRET_KEY: "ci-dummy-jwt-secret-key-minimum-32-chars-long"
          JWT_ALGORITHM: "HS256"
          ACCESS_TOCKEN_EXPIRE_MINUTES: "60"
          SUPABASE_URL: "https://ci-dummy.supabase.co"
          SUPABASE_KEY: "ci-dummy-supabase-key"
          SUPABASE_BUCKET: "documents"
          OPENAI_API_KEY: "sk-ci-dummy-openai-api-key"
          FRONTEND_URL: "http://localhost:3000"
        run: pytest tests/ -v

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build